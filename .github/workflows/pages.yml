name: Verifica e pubblica Circuit Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Test e pacchetto pubblico
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepara Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepara Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Installa il riferimento numerico indipendente
        run: |
          sudo apt-get update
          sudo apt-get install --yes ngspice
      - name: Riesegui i confronti analitici e SPICE
        env:
          CIRCUIT_NGSPICE_BIN: /usr/bin/ngspice
        run: node app/scripts/verify-numerics.cjs
      - name: Verifica modelli, dati e distribuzione
        run: node --test app/tests/*.test.cjs
      - name: Verifica il percorso RC con dati sintetici
        run: node app/scripts/check-rc-workflow.cjs
      - name: Prepara il sito senza materiali del corso
        run: python3 app/scripts/build-site.py
      - name: Carica soltanto il sito verificato
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Pubblica su GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configura GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
